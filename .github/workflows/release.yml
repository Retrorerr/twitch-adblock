name: Release Chromium extension

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify tag matches package version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${VERSION}"
          if [[ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${VERSION}. Expected ${EXPECTED_TAG}." >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Build and validate extension outputs
        run: npm run check

      - name: Stage the release package
        shell: bash
        run: |
          PACKAGE_DIR="${RUNNER_TEMP}/twitch-adblock-chromium"
          node scripts/package-extension.js "${PACKAGE_DIR}"
          (cd "${PACKAGE_DIR}" && zip -qr "${GITHUB_WORKSPACE}/twitch-adblock-chromium.zip" .)
          unzip -t "twitch-adblock-chromium.zip"
          if ! unzip -Z1 "twitch-adblock-chromium.zip" | grep -Fxq 'manifest.json'; then
            echo 'manifest.json is not at the ZIP root.' >&2
            exit 1
          fi
          sha256sum twitch-adblock-chromium.zip | awk '{print $1 "  " $2}' > twitch-adblock-chromium.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Twitch Adblock ${VERSION}" \
            --generate-notes \
            twitch-adblock-chromium.zip \
            twitch-adblock-chromium.sha256

